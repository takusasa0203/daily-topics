name: Daily 20-Min Topic Podcast (Morning & Evening)

on:
  schedule:
    # 毎朝 JST 7:00 (UTC 22:00 前日)
    - cron: '0 22 * * *'
    # 毎夕 JST 18:00 (UTC 09:00 当日)
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      edition:
        description: '配信エディションを選択'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - evening

permissions:
  contents: write

jobs:
  generate-podcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version

      - name: Generate 20-Min Podcast and Summary
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          EDITION="${{ github.event.inputs.edition }}"
          if [ -z "$EDITION" ]; then
            EDITION="auto"
          fi
          python src/main.py --edition "$EDITION"

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add digests/ README.md
          if git diff --staged --quiet; then
            echo "変更はありませんでした。"
          else
            git commit -m "chore: add 20-min topic podcast for $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
